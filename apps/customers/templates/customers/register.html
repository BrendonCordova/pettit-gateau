{% extends 'base.html' %}
{% block title %}Cadastro | Pettit Gateau{% endblock %}

{% block content %}
<section class="row justify-content-center mt-5" aria-labelledby="register-title">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 id="register-title" class="text-center mb-4 h3">Crie sua Conta</h1>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-dark w-100 mt-3">Criar Conta</button>
                </form>
                
                <div class="text-center mt-3">
                    <p>Já possui conta? <a href="{% url 'customers:login' %}">Faça Login</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
