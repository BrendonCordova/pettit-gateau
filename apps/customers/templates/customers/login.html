{% extends 'base.html' %}
{% block title %}Login | Pettit Gateau{% endblock %}

{% block content %}
<section class="row justify-content-center mt-5" aria-labelledby="login-title">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 id="login-title" class="text-center mb-4 h3">Acesse sua Conta</h1>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-dark w-100 mt-3">Entrar</button>
                </form>
                
                <div class="text-center mt-3">
                    <p>Ainda não tem conta? <a href="{% url 'customers:register' %}">Cadastre-se</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
